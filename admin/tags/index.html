<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Tags - Admin Nature Kaltim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
  </head>
  <body class="bg-gray-100 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
      
      <aside class="w-64 bg-slate-800 text-white flex flex-col shadow-lg">
        <div class="p-6 text-center border-b border-slate-700">
          <div class="flex items-center justify-center mb-3">
            <div class="w-12 h-12 bg-cyan-600 rounded-full flex items-center justify-center shadow-lg shadow-cyan-500/30">
              <i data-lucide="compass" width="24" class="text-white"></i>
            </div>
          </div>
          <h2 class="text-2xl font-bold text-cyan-400">Nature Admin</h2>
          <p class="text-xs text-gray-400 mt-1">Pengelola Wisata Kaltim</p>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
          <a href="../dashboard.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-700 transition-colors">
            <i data-lucide="home" width="18" class="mr-3"></i> Dashboard
          </a>
          <a href="../wisata/index.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-700 transition-colors">
            <i data-lucide="trees" width="18" class="mr-3"></i> Data Wisata
          </a>
          <a href="../category/index.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-700 transition-colors">
            <i data-lucide="folder" width="18" class="mr-3"></i> Kategori
          </a>
          <a href="index.html" class="flex items-center px-4 py-3 bg-cyan-600 text-white rounded-lg shadow-md">
            <i data-lucide="tag" width="18" class="mr-3"></i> Tags
          </a>
          <a href="../facility/index.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-700 transition-colors">
            <i data-lucide="wrench" width="18" class="mr-3"></i> Fasilitas
          </a>
          <a href="../image-wisata/index.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-700 transition-colors">
            <i data-lucide="image" width="18" class="mr-3"></i> Gambar
          </a>
          <a href="../user/index.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-700 transition-colors">
            <i data-lucide="users" width="18" class="mr-3"></i> User
          </a>
        </nav>

        <div class="p-4 border-t border-slate-700">
          <button onclick="handleLogout()" class="w-full flex items-center justify-center px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors">
            <i data-lucide="log-out" width="18" class="mr-2"></i> Logout
          </button>
        </div>
      </aside>

      <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center z-10">
          <h1 class="text-xl font-semibold text-gray-800">Manajemen Tags Wisata</h1>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <div class="text-sm font-medium text-gray-800" id="admin-name">Admin</div>
              <div class="text-xs text-gray-500">Administrator</div>
            </div>
            <div class="h-10 w-10 rounded-full bg-cyan-100 flex items-center justify-center text-cyan-600 font-bold border border-cyan-200">A</div>
          </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
          
          <div id="flash-feedback" class="max-w-4xl mx-auto mb-4"></div>

          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-700">Daftar Tags</h2>
            <a href="create.html" class="bg-cyan-600 hover:bg-cyan-700 text-white font-medium py-2 px-4 rounded-lg shadow-lg shadow-cyan-500/30 transition duration-200 flex items-center transform hover:-translate-y-0.5">
              <i data-lucide="plus" width="18" class="mr-2"></i> Tambah Tag
            </a>
          </div>

          <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
            <table class="w-full text-left border-collapse">
              <thead class="bg-gray-50 text-gray-600 uppercase text-xs font-bold tracking-wider">
                <tr>
                  <th class="px-6 py-4 text-left border-b">No</th>
                  <th class="px-6 py-4 text-left border-b">Nama Tag</th>
                  <th class="px-6 py-4 text-center border-b">Aksi</th>
                </tr>
              </thead>
              <tbody id="tag-tbody" class="text-gray-600 text-sm divide-y divide-gray-200">
                <tr>
                  <td colspan="3" class="p-8 text-center text-gray-400">
                    <div class="flex flex-col items-center justify-center">
                      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-cyan-600 mb-2"></div>
                      Memuat data tags...
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="index-tag.js"></script>
    <script>
      (function(){
        try {
          const raw = localStorage.getItem('admin_feedback');
          if (!raw) return;
          const obj = JSON.parse(raw);
          const container = document.getElementById('flash-feedback');
          if (!container) return;
          const div = document.createElement('div');
          div.className = obj.type === 'success' ? 'text-sm font-medium mt-4 text-green-600 bg-green-50 p-3 rounded-lg border border-green-200' : 'text-sm font-medium mt-4 text-red-600 bg-red-50 p-3 rounded-lg border border-red-200';
          div.textContent = obj.message || '';
          container.appendChild(div);
          localStorage.removeItem('admin_feedback');
        } catch (e) { console.warn('Flash feedback parse error', e); }
      })();

      function handleLogout() {
        if (confirm("Yakin ingin keluar?")) {
          localStorage.removeItem("token");
          window.location.href = "../../logres/login.html"; 
        }
      }
      window.addEventListener('load', () => { if(window.lucide) lucide.createIcons(); });
    </script>
  </body>
</html>
